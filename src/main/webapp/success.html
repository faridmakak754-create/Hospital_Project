<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message Sent Successfully</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .success-container {
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
            padding: 50px 40px;
            text-align: center;
            max-width: 500px;
            width: 100%;
            animation: fadeIn 0.8s ease-out;
            position: relative;
            overflow: hidden;
        }
        
        .success-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(to right, #6a11cb, #2575fc);
        }
        
        .success-icon {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 25px;
            animation: bounce 1s ease-in-out;
        }
        
        .success-icon i {
            font-size: 50px;
            color: white;
        }
        
        h2 {
            color: #2d3748;
            margin-bottom: 15px;
            font-size: 28px;
            font-weight: 700;
            animation: textSlide 0.8s ease-out 0.3s both;
        }
        
        p {
            color: #718096;
            line-height: 1.6;
            margin-bottom: 30px;
            font-size: 16px;
            animation: textSlide 0.8s ease-out 0.5s both;
        }
        
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: white;
            text-decoration: none;
            padding: 14px 30px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(106, 17, 203, 0.4);
            animation: textSlide 0.8s ease-out 0.7s both;
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(106, 17, 203, 0.5);
            background: linear-gradient(135deg, #2575fc 0%, #6a11cb 100%);
        }
        
        .btn:active {
            transform: translateY(1px);
        }
        
        .btn i {
            margin-right: 10px;
            font-size: 18px;
        }
        
        /* Confetti animation with pure CSS */
        .confetti {
            position: absolute;
            width: 8px;
            height: 8px;
            background-color: #ff6b6b;
            opacity: 0;
            border-radius: 50%;
            animation: confettiFall 3s ease-in-out forwards;
        }
        
        .confetti:nth-child(1) { left: 10%; animation-delay: 0.1s; background-color: #6a11cb; }
        .confetti:nth-child(2) { left: 20%; animation-delay: 0.3s; background-color: #2575fc; }
        .confetti:nth-child(3) { left: 30%; animation-delay: 0.5s; background-color: #ff6b6b; }
        .confetti:nth-child(4) { left: 40%; animation-delay: 0.7s; background-color: #4ecdc4; }
        .confetti:nth-child(5) { left: 50%; animation-delay: 0.9s; background-color: #ffe66d; }
        .confetti:nth-child(6) { left: 60%; animation-delay: 1.1s; background-color: #6a11cb; }
        .confetti:nth-child(7) { left: 70%; animation-delay: 1.3s; background-color: #2575fc; }
        .confetti:nth-child(8) { left: 80%; animation-delay: 1.5s; background-color: #ff6b6b; }
        .confetti:nth-child(9) { left: 90%; animation-delay: 1.7s; background-color: #4ecdc4; }
        .confetti:nth-child(10) { left: 95%; animation-delay: 1.9s; background-color: #ffe66d; }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-20px);
            }
            60% {
                transform: translateY(-10px);
            }
        }
        
        @keyframes textSlide {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        @keyframes confettiFall {
            0% {
                opacity: 1;
                transform: translateY(-100px) rotate(0deg);
            }
            100% {
                opacity: 0;
                transform: translateY(500px) rotate(360deg);
            }
        }
        
        @media (max-width: 480px) {
            .success-container {
                padding: 40px 25px;
            }
            
            h2 {
                font-size: 24px;
            }
            
            .success-icon {
                width: 80px;
                height: 80px;
            }
            
            .success-icon i {
                font-size: 40px;
            }
        }
    </style>
</head>
<body>
    <div class="success-container">
        <!-- Confetti elements -->
        <div class="confetti"></div>
        <div class="confetti"></div>
        <div class="confetti"></div>
        <div class="confetti"></div>
        <div class="confetti"></div>
        <div class="confetti"></div>
        <div class="confetti"></div>
        <div class="confetti"></div>
        <div class="confetti"></div>
        <div class="confetti"></div>
        
        <div class="success-icon">
            <i class="fas fa-check"></i>
        </div>
        <h2>✅ Message Sent Successfully!</h2>
        <p>Thank you for contacting us. We have received your message and will get back to you as soon as possible.</p>
        <a href="index.jsp" class="btn">
            <i class="fas fa-arrow-left"></i> Go Back to Home
        </a>
    </div>
</body>
</html>
